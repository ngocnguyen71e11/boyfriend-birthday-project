const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");

const button = document.getElementById("startButton");
const welcome = document.querySelector(".welcome");

let particles = [];
let state = "idle";

// Kích thước màn hình
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// Tạo đối tượng Particle
class Particle {

    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        this.size = Math.random() * 1.5 + 0.5;

        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;

        this.targetX = this.x;
        this.targetY = this.y;

        this.alpha = Math.random() * 0.8 + 0.2;

        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 250 + 50;
    }

    update() {

        if (state === "idle") {

            this.x += this.speedX;
            this.y += this.speedY;

            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;

            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;

        }

        else if (state === "gathering") {

            // Xoay và hội tụ về trung tâm

            this.angle += 0.04;
            this.radius *= 0.97;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const targetX = centerX + Math.cos(this.angle) * this.radius;
            const targetY = centerY + Math.sin(this.angle) * this.radius;

            this.x += (targetX - this.x) * 0.025;
            this.y += (targetY - this.y) * 0.025;

        }

        else if (state === "formation") {

            // Di chuyển đến vị trí tạo thành chữ

            this.x += (this.targetX - this.x) * 0.06;
            this.y += (this.targetY - this.y) * 0.06;

        }

    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `rgba(255, 215, 120, ${this.alpha})`;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#FFD700";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


// Tạo các hạt
function createParticles() {

    particles = [];

    for (let i = 0; i < 1000; i++) {

        particles.push(new Particle());

    }

}


// Lấy tọa độ các pixel tạo thành chữ
function getTextPositions(text) {

    const textCanvas = document.createElement("canvas");
    const textCtx = textCanvas.getContext("2d");

    textCanvas.width = canvas.width;
    textCanvas.height = canvas.height;

    const fontSize = Math.min(canvas.width / 7, 110);

    textCtx.fillStyle = "white";
    textCtx.textAlign = "center";
    textCtx.textBaseline = "middle";

    textCtx.font = `bold ${fontSize}px Arial`;

    textCtx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const imageData = textCtx.getImageData(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    );

    const positions = [];

    // Lấy mẫu pixel cách nhau 5 pixel
    for (let y = 0; y < textCanvas.height; y += 5) {

        for (let x = 0; x < textCanvas.width; x += 5) {

            const index = (y * textCanvas.width + x) * 4;

            if (imageData.data[index + 3] > 128) {

                positions.push({ x, y });

            }

        }

    }

    return positions;

}


// Phân bổ các hạt vào vị trí chữ
function formText(text) {

    const positions = getTextPositions(text);

    // Trộn ngẫu nhiên vị trí chữ
    positions.sort(() => Math.random() - 0.5);

    particles.forEach((particle, index) => {

        if (index < positions.length) {

            particle.targetX = positions[index].x;
            particle.targetY = positions[index].y;

        }

        else {

            // Hạt dư nằm xung quanh chữ
            particle.targetX = Math.random() * canvas.width;
            particle.targetY = Math.random() * canvas.height;

        }

    });

}


// Vòng lặp hoạt ảnh
function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(particle => {

        particle.update();
        particle.draw();

    });

    requestAnimationFrame(animate);

}
